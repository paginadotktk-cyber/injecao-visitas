name: Gerador de Trafego 24/7

on:
  schedule:
    # Inicia automaticamente a cada 5 horas (para nunca bater o limite de 6h do GitHub)
    - cron: '0 */5 * * *'
  workflow_dispatch: # Permite iniciar manualmente

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Rodar Gerador
        env:
          TZ: "America/Sao_Paulo" # Mantém o fuso horário correto para os picos das 09h e 18h
        timeout-minutes: 300 # Mata o processo em 5 horas limpas para o próximo assumir
        run: python gerador_trafego.py
