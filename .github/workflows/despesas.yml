name: Gestor de Despesas UTMify

on:
  schedule:
    - cron: '*/20 * * * *' # Roda a cada 20 minutos
  workflow_dispatch:

jobs:
  run-despesas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Instalar Playwright e Dependências
        run: |
          pip install playwright
          playwright install chromium
      - run: python gestor_despesas.py
