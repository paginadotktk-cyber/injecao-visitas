name: Gestor UTMify (20 min)

on:
  schedule:
    - cron: '*/20 * * * *' 
  workflow_dispatch:

jobs:
  run-despesas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Instalar Playwright
        run: |
          pip install playwright
          playwright install chromium
      - name: Injetar Gastos
        run: python gestor_despesas.py
