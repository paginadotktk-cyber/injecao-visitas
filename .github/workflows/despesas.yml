name: Gestor UTMify (24/7 Loop)

on:
  schedule:
    # O despertador agora só bate a cada 5 horas para reiniciar o motor
    - cron: '0 */5 * * *' 
  workflow_dispatch:

jobs:
  run-despesas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Instalar Playwright
        run: |
          pip install playwright
          playwright install chromium
      - name: Injetar Gastos
        run: python gestor_despesas.py
