name: Gerador de Vendas 24/7

on:
  schedule:
    # Reinicia a máquina a cada 4 horas exatas (00:00, 04:00, 08:00, 12:00, 16:00, 20:00)
    - cron: '0 */4 * * *'
  workflow_dispatch: # Permite que você dê a partida manualmente

jobs:
  run-bot-vendas:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar os arquivos (incluindo o token JSON)
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Rodar Gerador de Vendas
        env:
          TZ: "America/Sao_Paulo" # Mantém os picos de horário sincronizados com o Brasil
        # Limita a vida da máquina para 4 horas (sincronizado com o script Python que finaliza em 3h50m)
        timeout-minutes: 240
        # O parâmetro -u força o print a aparecer em tempo real no log do GitHub Actions
        run: python -u gerador_vendas.py
