name: Gerador de Vendas 24/7

on:
  schedule:
    # Reinicia a máquina a cada 5 horas para driblar o limite de 6h do GitHub
    - cron: '0 */5 * * *'
  workflow_dispatch: # Permite que você dê a partida manualmente

jobs:
  run-bot-vendas:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar os arquivos (incluindo o token JSON)
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Rodar Gerador de Vendas
        env:
          TZ: "America/Sao_Paulo" # Mantém os picos de horário sincronizados com o Brasil
        timeout-minutes: 300 # Tempo de vida da máquina antes do reset automático
        run: python gerador_vendas.py
